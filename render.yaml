services:
  - type: web
    name: ford-vinguard-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements-api.txt && python scripts/fetch_model_artifacts.py
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ISSUER
        value: ford-vinguard-api
      - key: JWT_AUDIENCE
        value: ford-vinguard-api
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: DEMO_TOKEN_SECRET
        sync: false
      - key: MODELS_DIR
        value: models
      - key: CHURN_MODEL_FILENAME
        value: churn_pos_venda_rf_calibrated.joblib
      - key: PERFIL_MODEL_FILENAME
        value: kmeans_segmentador_pos_venda.joblib
      - key: CHURN_MODEL_SHA256
        value: 0cdb70f14e3f4a3b43d3365cbe055d7ec034aadaac63457e78ac6e1a92d4af08
      - key: PERFIL_MODEL_SHA256
        value: e797fe62fdf4d0e7854705cee486d6942a250be62e3eeefb789c782abda0bf6c
      - key: CHURN_MODEL_URL
        sync: false
      - key: PERFIL_MODEL_URL
        sync: false
