services:
  - type: web
    name: ford-vinguard-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements-api.txt && python scripts/fetch_model_artifacts.py
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ISSUER
        value: ford-vinguard-api
      - key: JWT_AUDIENCE
        value: ford-vinguard-api
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: DEMO_TOKEN_SECRET
        sync: false
      - key: MODELS_DIR
        value: models
      - key: CHURN_MODEL_FILENAME
        value: churn_pos_venda_rf_calibrated.joblib
      - key: PERFIL_MODEL_FILENAME
        value: segmento_pos_venda_classifier_experimental.joblib
      - key: CHURN_MODEL_SHA256
        value: bc096497fbe0fccb5109e7a115cd7983c1feff02ea1498301e27a766467bd75b
      - key: PERFIL_MODEL_SHA256
        value: 6b6f2ef1718f03227d99fb2d7342d8cd5c221a42242e233ec6abc45c5831664f
      - key: CHURN_MODEL_URL
        sync: false
      - key: PERFIL_MODEL_URL
        sync: false
